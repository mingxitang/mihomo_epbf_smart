name: Release successful eBPF build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build eBPF branch run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve and validate build run
        id: build
        shell: bash
        run: |
          set -euo pipefail

          run_id="$(jq -r '.inputs.run_id' "${GITHUB_EVENT_PATH}")"

          if ! [[ "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "Invalid build run ID: ${run_id}" >&2
            exit 1
          fi

          run_json=""
          for attempt in {1..24}; do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status // ""' <<<"${run_json}")"
            if [ "${status}" = "completed" ]; then
              break
            fi
            echo "Build run ${run_id} is ${status}; waiting for completion (${attempt}/24)."
            sleep 5
          done

          status="$(jq -r '.status // ""' <<<"${run_json}")"
          workflow_name="$(jq -r '.name // ""' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch // ""' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha // ""' <<<"${run_json}")"
          started_at="$(jq -r '.run_started_at // ""' <<<"${run_json}")"
          build_url="$(jq -r '.html_url // ""' <<<"${run_json}")"

          if [ "${workflow_name}" != "Build eBPF branch" ]; then
            echo "Run ${run_id} belongs to '${workflow_name}', not the eBPF build workflow" >&2
            exit 1
          fi
          if [ "${status}" != "completed" ]; then
            echo "Build run ${run_id} did not complete before the release timeout: ${status}" >&2
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "Build run ${run_id} did not succeed: ${conclusion}" >&2
            exit 1
          fi
          if [ "${head_branch}" != "Alpha" ]; then
            echo "Build run ${run_id} is from '${head_branch}', not Alpha" >&2
            exit 1
          fi
          if ! [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Build run ${run_id} returned an invalid commit: ${head_sha}" >&2
            exit 1
          fi

          short_sha="${head_sha:0:12}"
          release_date="$(date -u -d "${started_at}" +%Y%m%d)"
          title_date="$(date -u -d "${started_at}" +%Y-%m-%d)"
          tag="ebpf-alpha-${release_date}-r${run_id}-${short_sha}"

          {
            echo "run_id=${run_id}"
            echo "head_sha=${head_sha}"
            echo "short_sha=${short_sha}"
            echo "started_at=${started_at}"
            echo "build_url=${build_url}"
            echo "title_date=${title_date}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download successful build artifacts
        if: steps.build.outputs.exists == 'false'
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "${BUILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name mihomo \
            --dir artifacts/mihomo

      - name: Verify and prepare release assets
        if: steps.build.outputs.exists == 'false'
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_COMMIT: ${{ steps.build.outputs.head_sha }}
          BUILD_STARTED_AT: ${{ steps.build.outputs.started_at }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          set -euo pipefail
          mkdir -p release

          name="mihomo"
          artifact_root="artifacts/${name}"
          binary="${artifact_root}/dist/${name}"
          checksum="${binary}.sha256"

          for required in "${binary}" "${checksum}"; do
            if [ ! -f "${required}" ]; then
              echo "Required release artifact is missing: ${required}" >&2
              find artifacts -maxdepth 3 -type f -print >&2
              exit 1
            fi
          done
          (cd "${artifact_root}" && sha256sum -c "dist/${name}.sha256")

          cp "${binary}" "release/${name}"
          (cd release && sha256sum "${name}" > "${name}.sha256")

          {
            echo "BUILD_RUN_ID=${BUILD_RUN_ID}"
            echo "COMMIT_SHA=${BUILD_COMMIT}"
            echo "BUILD_STARTED_AT=${BUILD_STARTED_AT}"
            echo "BUILD_URL=${BUILD_URL}"
          } > release/BUILD_INFO.txt

      - name: Publish prerelease
        if: steps.build.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.build.outputs.tag }}
          HEAD_SHA: ${{ steps.build.outputs.head_sha }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
          TITLE_DATE: ${{ steps.build.outputs.title_date }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Automated Android ARM64 eBPF Alpha build from commit \`${HEAD_SHA}\`."
            echo
            echo "- Build workflow: [run ${BUILD_RUN_ID}](${BUILD_URL})"
            echo "- Platform: Android ARM64"
            echo "- Assets: mihomo and mihomo.sha256"
          } > "${notes_file}"

          gh release create "${TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "Android eBPF Alpha ${TITLE_DATE} (${SHORT_SHA})" \
            --notes-file "${notes_file}" \
            --prerelease

      - name: Report release
        shell: bash
        env:
          TAG: ${{ steps.build.outputs.tag }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          ALREADY_EXISTS: ${{ steps.build.outputs.exists }}
        run: |
          set -euo pipefail
          release_url="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          {
            echo "## eBPF release"
            echo
            echo "- Release: [${TAG}](${release_url})"
            echo "- Source build run: ${BUILD_RUN_ID}"
            if [ "${ALREADY_EXISTS}" = "true" ]; then
              echo "- Result: release already existed; no duplicate was created"
            else
              echo "- Result: published and checksums verified"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

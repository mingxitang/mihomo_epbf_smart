name: Sync Smart and eBPF upstreams

on:
  workflow_dispatch:
    inputs:
      target:
        description: Branch to synchronize
        type: choice
        options: [both, Alpha, codex/ebpf-next]
        default: both
      dry_run:
        description: Trial merges only; no pushes, issues, or releases
        type: boolean
        default: false
      force_build:
        description: Rebuild and publish Alpha even when no source changed
        type: boolean
        default: false
  schedule:
    - cron: "23 0 */3 * *"
  pull_request:
    branches: [Alpha, codex/ebpf-next]
    paths: [.github/workflows/sync-upstreams.yml, '.github/scripts/**', docs/upstream-sync.md]

permissions:
  contents: read
concurrency:
  group: sync-upstreams-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          cache: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  sync:
    if: github.event_name != 'pull_request'
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'Alpha' && '["Alpha"]' || inputs.target == 'codex/ebpf-next' && '["codex/ebpf-next"]' || '["Alpha","codex/ebpf-next"]') }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      TARGET: ${{ matrix.target }}
      SLUG: ${{ matrix.target == 'Alpha' && 'alpha' || 'next' }}
      REPORT: sync-report
      CGO_ENABLED: "0"
      SKIP_INTEROP_TEST: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache-dependency-path: work/go.sum
      - name: Prepare independent snapshots using the automation checkout
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 automation/.github/scripts/sync_upstreams.py prepare
          --repo work --target "$TARGET" --report "$REPORT"
      - name: Save candidate for validation and recovery
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        id: candidate
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="automation/sync-${SLUG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Candidate: ${branch}" >> "$GITHUB_STEP_SUMMARY"
      - name: Test and vet the candidate
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        working-directory: work
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1
          packages=(./common/ebpf/... ./listener/sing_ebpf/...)
          integration=(./common/ebpf/...)
          if [ -d experimental/tanaka ]; then
            packages+=(./experimental/tanaka/common/ebpf/... ./experimental/tanaka/listener/sing_ebpf/...)
            integration+=(./experimental/tanaka/common/ebpf/...)
          fi
          go test -count=1 -tags "with_gvisor with_ebpf" "${packages[@]}"
          go test -run '^$' -tags "with_gvisor with_ebpf ebpf_integration" "${integration[@]}"
      - name: Set up Android NDK r29
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Verify BPF generation and Android build
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        working-directory: work
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make ebpf_check
          if [ -d experimental/tanaka/common/ebpf ]; then
            make -C experimental/tanaka/common/ebpf check
          fi
          GOOS=android GOARCH=arm64 go build -tags "with_gvisor with_ebpf" \
            -trimpath -o "${RUNNER_TEMP}/mihomo-${SLUG}" .
          git diff --exit-code
      - name: Promote only if the target has not moved
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 automation/.github/scripts/sync_upstreams.py promote
          --repo work --target "$TARGET" --report "$REPORT"
      # Token-authenticated pushes do not start push workflows automatically.
      - name: Dispatch the existing Alpha release pipeline
        if: >-
          env.DRY_RUN != 'true' && matrix.target == 'Alpha' &&
          (steps.promote.outcome == 'success' || env.FORCE_BUILD == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ebpf.yml --repo "$GITHUB_REPOSITORY" --ref Alpha
      - name: Remove successfully integrated candidate
        if: steps.promote.outcome == 'success' && steps.prepare.outputs.blocked != 'true'
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: git push origin --delete "$CANDIDATE_BRANCH"
      - name: Update branch-specific failure issue
        if: always() && !cancelled() && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BLOCKED: ${{ steps.prepare.outputs.blocked }}
          WAITING: ${{ steps.prepare.outputs.waiting }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT"
          title="[automation] Upstream synchronization needs attention (${TARGET})"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${title}\" in:title" --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ "$JOB_STATUS" != success ] || [ "$BLOCKED" = true ]; then
            body="${REPORT}/issue.md"
            if [ -f "${REPORT}/summary.md" ]; then cp "${REPORT}/summary.md" "$body"; else
              echo "Synchronization failed before detection; inspect the workflow log." > "$body"
            fi
            {
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "Candidate: ${CANDIDATE_BRANCH:-none}"
              echo "Targets advance only after validation. Inspect promotion status to see which sources were integrated."
              echo "Download diagnostics and continue on the candidate branch; preserve downstream fixes."
            } >> "$body"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            fi
          elif [ "$WAITING" != true ] && [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-${{ env.SLUG }}-${{ github.run_attempt }}
          path: ${{ env.REPORT }}
          if-no-files-found: warn
          retention-days: 14
      - name: Fail visibly for unresolved sources
        if: steps.prepare.outputs.blocked == 'true'
        run: |
          echo "::error::Unresolved sources; inspect diagnostics. Their baselines were not advanced."
          exit 1
